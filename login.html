<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0e14"><title>登录你的专注空间 · 专注一下</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><link rel="stylesheet" href="theme.css"><script src="theme.js"></script></head><body class="login-page">
<a class="brand login-brand" href="./"><span class="brand-orb"><i></i></span><span>专注一下</span></a>
<button type="button" class="theme-trigger login-theme-trigger" aria-label="更换主题配色" data-theme-open><span class="theme-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button><a href="./" class="back-home">先逛逛我的空间 ↗</a>
<div class="auth-layout"><section class="auth-story"><h1>时间会看见，<br>你认真<span>的样子。</span></h1><p>每一段安静的专注，都在悄悄塑造更好的你。<br>登录，留住你的每一步成长。</p><div class="auth-orbit"><div class="orbit-line one"></div><div class="orbit-line two"></div><div class="orbit-line three"></div><div class="orb-core"><span>此刻</span><b>值得专注</b></div><span class="floating-chip chip-one">✦ 每天进步一点点</span><span class="floating-chip chip-two">25:00 <i></i> 属于你的时间</span></div><div class="auth-features"><span>✧ 个人学习档案</span><span>↗ 多设备同步</span><span>◷ 日 · 周 · 月 · 年</span></div></section>
<section class="auth-card panel timer-card"><div class="auth-card-inner"><span class="auth-greeting">你的专属角落</span><h2 id="auth-title">欢迎回来<span> ✧</span></h2><p id="auth-description">让今天的专注，接上昨天的努力。</p><div class="auth-tabs" role="tablist" aria-label="账号操作"><button role="tab" aria-selected="true" data-auth="login" class="selected">登录</button><button role="tab" aria-selected="false" data-auth="signup">注册</button></div><form id="auth-form"><label id="name-field" hidden>怎么称呼你<input id="auth-name" autocomplete="nickname" maxlength="30" placeholder="你的昵称"></label><label>邮箱地址<input id="auth-email" type="email" autocomplete="email" required placeholder="输入你的邮箱" maxlength="254"></label><label id="password-field">密码<div class="password-wrap"><input id="auth-password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required placeholder="至少 8 位密码"><button id="toggle-password" type="button" aria-label="显示密码">◉</button></div></label><label id="verification-field" hidden>邮箱验证码<input id="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" minlength="8" maxlength="8" placeholder="输入 8 位验证码"></label><button type="button" id="resend-code" hidden>重新发送验证码</button><div class="auth-form-options"><span id="auth-hint">密码验证后，安全保持登录 7 天</span><button id="forgot-password" type="button">忘记密码？</button></div><p id="auth-message" role="status" hidden></p><button class="primary" id="auth-submit" type="submit"><span id="auth-submit-label">回到我的专注空间</span><span>↗</span></button></form><a class="guest-link" href="./">先不登录，直接开始 <span>→</span></a><div class="auth-privacy">密码经过安全加密处理<br>专注记录按账号独立保存</div></div></section></div>
<div class="auth-footnote">一点点专注，一点点靠近理想中的自己。<span>© 专注一下</span></div>
